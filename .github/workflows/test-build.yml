name: Test Build

# Runs automatically on every commit pushed to any branch,
# and on every pull request. Can also be started manually.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "releases/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Fixes "Cannot fit requested classes in a single dex file (> 64K methods)"
      # for test builds only, without touching build.gradle.
      - name: Enable multidex (CI only)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/multidex.gradle <<'EOF'
          allprojects {
              pluginManager.withPlugin('com.android.application') {
                  android.defaultConfig.multiDexEnabled = true
              }
          }
          EOF

      # EN-only flavor -> LeanKeyboardF_EN_v<version>_d.apk
      - name: Run unit tests, lint, and build debug APK (EN)
        run: >
          ./gradlew testOriginEnDebugUnitTest lintOriginEnDebug assembleOriginEnDebug
          --stacktrace
          --parallel
          --build-cache
          -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: LeanKeyboardF-EN-test-${{ github.run_number }}-${{ github.sha }}
          # Matches only the EN build (not EN+AR)
          path: "**/build/outputs/apk/**/LeanKeyboardF_EN_v*_d.apk"
          retention-days: 14
          if-no-files-found: error
