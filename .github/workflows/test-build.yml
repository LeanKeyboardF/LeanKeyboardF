name: Test Build

# Runs automatically on every commit pushed to any branch,
# and on every pull request. Can also be started manually.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "releases/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: >
          ./gradlew assembleOriginEnArDebug
          --stacktrace
          --parallel
          --build-cache
          -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: LeanKeyboardF-test-${{ github.run_number }}-${{ github.sha }}
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 14
          if-no-files-found: errorname: Test Build

