name: Build APKs

# Run manually from Actions. Release builds are serialized because build.sh
# updates the shared versionCode file and pushes it back to the repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (versionName), e.g. 6.2.0"
        required: true
        type: string
      flavors:
        description: "Comma-separated flavors to build"
        required: false
        default: "playstore,origin"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release inputs
        id: validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_FLAVORS: ${{ inputs.flavors || 'playstore,origin' }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic version text such as 1.2.3 or 1.2.3-rc.1." >&2
            exit 1
          fi

          case "$RELEASE_FLAVORS" in
            playstore|origin|playstore,origin|origin,playstore) ;;
            *) echo "Flavors must be playstore, origin, or both separated by a comma." >&2; exit 1 ;;
          esac

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "flavors=$RELEASE_FLAVORS" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        run: chmod +x gradlew build.sh

      # Use the same tracked keystore files as local release builds.
      - name: Verify release keystore
        run: |
          set -euo pipefail
          properties_file="keystore/keystore.properties"
          if [[ ! -s "$properties_file" ]]; then
            echo "Missing keystore/keystore.properties in the checkout." >&2
            exit 1
          fi

          store_file="$(sed -n 's/^storeFile=//p' "$properties_file" | head -n1 | tr -d '\r')"
          case "$store_file" in
            ""|*/*|..)
              echo "Invalid storeFile entry in keystore/keystore.properties." >&2
              exit 1
              ;;
          esac

          if [[ ! -s "keystore/$store_file" ]]; then
            echo "Release keystore file is missing from the keystore directory." >&2
            exit 1
          fi

          for property in storePassword keyAlias keyPassword; do
            if ! awk -F= -v key="$property" '$1 == key { sub(/\r$/, "", $2); if (length($2) > 0) found = 1 } END { exit !found }' "$properties_file"; then
              echo "Missing or empty $property entry in keystore/keystore.properties." >&2
              exit 1
            fi
          done

      - name: Build (${{ steps.validate.outputs.version }})
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_FLAVORS: ${{ steps.validate.outputs.flavors }}
        run: ./build.sh "$RELEASE_VERSION" "$RELEASE_FLAVORS"

      # Persist only the non-secret versionCode. Never add signing material
      # from this workflow to a new commit.
      - name: Commit versionCode change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f keystore/versioncode.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update release versionCode [skip ci]"
            git push
          fi

      - name: Select release description
        id: release-notes
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          notes_file=".github/release-notes/v${RELEASE_VERSION}.md"
          if [[ -f "$notes_file" ]]; then
            echo "path=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # Release assets do not count against the Actions artifact storage quota.
      - name: Publish GitHub Release (draft)
        if: steps.release-notes.outputs.path != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.validate.outputs.version }}
          name: LeanKeyboardF v${{ steps.validate.outputs.version }}
          draft: true
          fail_on_unmatched_files: true
          body_path: ${{ steps.release-notes.outputs.path }}
          files: |
            releases/${{ steps.validate.outputs.version }}/*.apk
            releases/${{ steps.validate.outputs.version }}/*.aab

      - name: Publish GitHub Release with generated notes (draft)
        if: steps.release-notes.outputs.path == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.validate.outputs.version }}
          name: LeanKeyboardF v${{ steps.validate.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            releases/${{ steps.validate.outputs.version }}/*.apk
            releases/${{ steps.validate.outputs.version }}/*.aab

      # Optional copy as a workflow artifact. Quota exhaustion must not fail
      # the release build; the GitHub Release remains the primary asset store.
      - name: Upload APKs / AAB (artifact)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LeanKeyboardF-v${{ steps.validate.outputs.version }}
          path: |
            releases/${{ steps.validate.outputs.version }}/*.apk
            releases/${{ steps.validate.outputs.version }}/*.aab
          retention-days: 1
          if-no-files-found: error
