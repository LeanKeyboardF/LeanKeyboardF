apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
def keystoreProperties = new Properties()
def keystoreAvailable = keystorePropertiesFile.exists()
if (keystoreAvailable) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.EdS.LeanKeyboardF'

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.EdS.LeanKeyboardF"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('appVersionCode') ? (project.property('appVersionCode') as Integer) : 205
        versionName project.hasProperty('appVersionName') ? project.property('appVersionName') as String : "6.1.35"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (keystoreAvailable) {
                storeFile rootProject.file("keystore/" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        disable 'MissingTranslation', 'NewApi'
    }

    // Оголошення двох вимірів
    flavorDimensions "distribution", "locale"

    productFlavors {
        playstore {
            dimension = "distribution"   // присвоєння
            applicationId "com.EdS.LeanKeyboardF"
            // Play policy forbids an app distributed through Play from
            // downloading and prompting install of an APK from outside
            // Play - updates must go through Play's own mechanism. This
            // flag is how the shared About screen decides whether to show
            // the GitHub-based "check for update" action at all.
            buildConfigField "boolean", "SUPPORTS_SELF_UPDATE", "false"
        }
        origin {
            dimension = "distribution"
            applicationId "com.EdS.LeanKeyboardF"
            buildConfigField "boolean", "SUPPORTS_SELF_UPDATE", "true"
        }

        create("all") {
            dimension = "locale"
        }

        en {
            dimension = "locale"
            resConfigs "en"
        }
    }

    // Автовиявлення мов та створення flavor'ів en+<мова>
    def valuesDirs = file("src/main/res").listFiles({ File f ->
        f.isDirectory() && f.name.startsWith("values-")
    } as FileFilter) ?: ([] as File[])

    def densityQualifiers = ["hdpi", "mdpi", "xhdpi", "xxhdpi", "xxxhdpi", "tvdpi", "ldpi", "nodpi", "anydpi"]
    def excludedLocales = ["ar-rXB"]

    def detectedLocales = valuesDirs
            .collect { it.name.replace("values-", "") }
            .findAll { code -> !densityQualifiers.any { q -> code.endsWith(q) } }
            .findAll { code -> !excludedLocales.contains(code) }
            .unique()
            .sort()

    def localeLabels = [
            "uk": "UA", "ru": "RU", "de": "DE", "fr": "FR", "it": "IT",
            "es": "ES", "nl": "NL", "ro": "RO", "bg": "BG", "el": "EL",
            "tr": "TR", "sv": "SV", "sl": "SL", "th": "TH", "fa": "FA",
            "ar": "AR", "is-rIS": "IS"
    ]

    detectedLocales.each { code ->
        def flavorName = "en" + code.replaceAll("[^a-zA-Z0-9]", "").capitalize()
        productFlavors.create(flavorName) {
            dimension = "locale"   // присвоєння
            resConfigs "en", code
        }
    }

    // Фільтр варіантів: Play Store лише з "all", Origin без "all"
    variantFilter { variant ->
        def flavorNames = variant.flavors*.name
        boolean isPlaystore = flavorNames.contains("playstore")
        boolean isAllLocales = flavorNames.contains("all")

        if (isPlaystore && !isAllLocales) {
            variant.setIgnore(true)
        }

        if (flavorNames.contains("origin") && isAllLocales) {
            variant.setIgnore(true)
        }
    }

    // Налаштування імен APK (опціонально, можна залишити як є)
    applicationVariants.all { variant ->
        def project = "LeanKeyboardF"
        def flavorNames = variant.productFlavors*.name
        def localeFlavor = flavorNames.find { it != "playstore" && it != "origin" }

        def localeTag
        if (localeFlavor == "all" || localeFlavor == null) {
            localeTag = ""
        } else if (localeFlavor == "en") {
            localeTag = "_EN"
        } else {
            def originalCode = detectedLocales.find { c ->
                ("en" + c.replaceAll("[^a-zA-Z0-9]", "").capitalize()) == localeFlavor
            }
            def label = localeLabels[originalCode] ?: (originalCode ?: localeFlavor).toUpperCase()
            localeTag = "_EN+${label}"
        }

        // Same tag used in the APK filename below, exposed at runtime so
        // the in-app update checker (origin flavor only - see
        // UpdateChecker) can build the exact asset filename for the
        // release matching THIS variant's language combo, e.g.
        // "LeanKeyboardF_EN+UA_v1.2.3_r.apk". Single source of truth:
        // if this naming scheme ever changes, both places update together.
        variant.buildConfigField "String", "UPDATE_ASSET_LOCALE_TAG", "\"${localeTag}\""

        variant.outputs.each { output ->
            def buildType = variant.buildType.name.take(1)
            def version = variant.versionName

            def newApkName = sprintf("%s%s_v%s_%s.apk", [project, localeTag, version, buildType])
            output.outputFileName = new File(newApkName)
        }
    }

    // CI helper: with 2 flavor dimensions, AGP does not generate flavor-only
    // aggregate tasks (e.g. "assembleOriginRelease" doesn't exist - only
    // exact per-combo tasks like "assembleOriginEnRelease" do), and their
    // exact set grows every time a translation is added. Rather than have
    // build.sh guess/parse "gradlew tasks" output, print the real variant
    // names here (config-time, runs on every Gradle invocation) so the
    // script can build the exact task list itself. Silent unless build.sh
    // asks for it via -PciListVariants=true.
    if (project.hasProperty('ciListVariants')) {
        applicationVariants.all { variant ->
            if (variant.buildType.name == "release") {
                println "CI_VARIANT::${variant.name}::${variant.productFlavors*.name.join(',')}"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation(rootProject.ext.espressoCoreVersion, {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation rootProject.ext.junitVersion
    implementation rootProject.ext.appCompatXVersion
    implementation rootProject.ext.leanbackCompatXVersion
    implementation rootProject.ext.constraintXVersion
    implementation rootProject.ext.designXVersion
    implementation rootProject.ext.voiceOverlayVersion
}
