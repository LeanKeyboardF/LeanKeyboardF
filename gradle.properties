android.useAndroidX=true
android.enableJetifier=true

# R8 was OOM-ing in CI (java.lang.OutOfMemoryError: Java heap space during
# minifyOriginXxReleaseWithR8). Root cause: two flavor dimensions
# (distribution x locale) mean build.sh's single `./gradlew assemble...`
# invocation runs assembleOriginRelease for EVERY locale flavor -> R8 runs
# once per locale, all inside the SAME long-lived Gradle daemon JVM, and
# that JVM had no explicit heap set, so it fell back to Gradle's default
# heuristic (too small for dozens of sequential R8 invocations - each one
# leaves DEX/class-graph garbage the JVM doesn't necessarily reclaim before
# the next one starts). GitHub's ubuntu-latest runners have 16GB RAM,
# 6g leaves headroom for the OS, the JDK/JIT itself, and the separate R8
# worker process's own overhead. Bump this further if new locales get
# added and it OOMs again; if it's still not enough even at 6-8g, the real
# fix is splitting build.sh's task list into a few smaller `./gradlew`
# invocations (each gets a fresh daemon/heap) instead of one invocation
# covering every locale at once.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Caps how many tasks Gradle's worker API runs concurrently within that one
# daemon - without this, parallel workers (R8 among them) can each try to
# claim a big chunk of the heap above at the same time and defeat the
# point of raising Xmx.
org.gradle.workers.max=2

# AGP 9.0 (Jan 2026) switched to new DSL interfaces by default and removed
# the old ProductFlavor.setDimension setter our build.gradle relies on via
# the legacy Groovy "dimension \"...\"" syntax (flavorDimensions/dimension,
# variantFilter, applicationVariants.all are all old-DSL APIs). Opt out to
# restore AGP 8.13 behaviour until build.gradle is migrated to the new DSL.
# This opt-out is removed entirely in AGP 10.0 (planned mid-2026).
android.newDsl=false
